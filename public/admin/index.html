    <!--
      Sveltia CMS — an actively-maintained, drop-in replacement for Decap CMS.
      It reads the same /admin/config.yml and renders the same collections.
      Auth is GitHub OAuth via the relay configured as `backend.base_url` in
      config.yml (no Netlify Identity / Git Gateway, which Netlify has retired).
      Editors log in with a GitHub account that has write access to the repo.
    -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
  </body>
